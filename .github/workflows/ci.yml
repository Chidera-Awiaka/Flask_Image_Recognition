name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"   # hide TensorFlow's noisy startup logs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # TensorFlow 2.10 does not support 3.11+
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pylint
        run: pylint app.py model.py tests

      - name: Run pytest
        run: pytest -v --cov=app --cov=model --cov-report=term-missing
