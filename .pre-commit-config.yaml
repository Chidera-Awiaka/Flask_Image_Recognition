# Checks that run automatically before every `git commit`.
# Install once with:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace      # remove stray spaces at line ends
      - id: end-of-file-fixer        # ensure files end with one newline
      - id: check-yaml               # catch broken YAML (e.g. the CI workflow)
      - id: check-merge-conflict     # block leftover <<<<<<< markers
      - id: check-added-large-files  # stop accidental large uploads
        args: ["--maxkb=1000"]

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system             # uses the project's virtual environment
        types: [python]
        args: ["--rcfile=.pylintrc"]
